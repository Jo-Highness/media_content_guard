name: Bug report
description: Report a problem with Media Content Guard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much
        detail as you can — it makes fixing the issue much faster.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: "Settings → About (e.g. 2026.2.0)"
      placeholder: "2026.2.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Media Content Guard version
      description: "The version installed via HACS (e.g. 1.0.0)"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Rules and players setup
      description: >-
        How many rules are configured, which media_player entities do they
        watch, and which metadata fields are checked? Mention the player brand
        (Sonos, Music Assistant, …) and whether players are grouped. Please
        include the media attributes of the player while the content plays
        (Developer tools → States).
      placeholder: |
        - Rule "Living room": media_player.sonos_move, media_player.kitchen
          fields: title, album, artist, content ID
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: >-
        Enable debug logging by adding the following to configuration.yaml,
        restart Home Assistant, reproduce the issue, then paste the relevant log
        lines here.
      value: |
        logger:
          default: warning
          logs:
            custom_components.media_content_guard: debug
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am running the latest version of Media Content Guard.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have included debug logs (or explained why I could not).
          required: false
