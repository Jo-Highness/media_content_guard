<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2994A"/>
      <stop offset="1" stop-color="#EB5757"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="256" rx="112" fill="url(#sheen)"/>

  <!-- shield -->
  <path d="M256 70 L396 120 V266 C396 348 336 404 256 436 C176 404 116 348 116 266 V120 Z"
        fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="18"
        stroke-linejoin="round"/>

  <!-- music note -->
  <g fill="#ffffff">
    <rect x="262" y="150" width="20" height="150" rx="8"/>
    <path d="M272 150 C300 160 330 176 336 214 C318 196 296 190 272 190 Z"/>
    <ellipse cx="238" cy="304" rx="44" ry="34" transform="rotate(-20 238 304)"/>
  </g>

  <!-- "blocked" badge -->
  <circle cx="374" cy="392" r="66" fill="#ffffff" stroke="#EB5757" stroke-width="8"/>
  <circle cx="374" cy="392" r="38" fill="none" stroke="#EB5757" stroke-width="14"/>
  <line x1="347" y1="419" x2="401" y2="365" stroke="#EB5757" stroke-width="14" stroke-linecap="round"/>
</svg>
